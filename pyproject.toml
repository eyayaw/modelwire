[project]
name = "modelwire"
version = "0.1.0"
description = "Async clients for the OpenAI Responses, Anthropic Messages, and System One APIs, and servers compatible with them."
readme = "README.md"
requires-python = ">=3.15"
authors = [{ name = "Eyayaw Beze" }]
license = "MIT"
dependencies = [
    "httpx2>=2.13",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-randomly>=5",
    "ruff>=0.17",
    "ty>=0.0.86",
]
